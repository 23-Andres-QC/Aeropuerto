# nginx del sistema del servidor (compartido, ver /opt/PUERTOS.md): publica https://aeropuerto.tujuegoya.com, sin
# puerto, como los demás subdominios de tujuegoya.com (Cloudflare delante, con su certificado de origen), y lo pasa a la
# web de este proyecto (WEB_TLS_PORT=8443 de servidor.env). Va por HTTPS para que la web y la API vean https (cookie
# Secure). En el servidor se enlaza, no se copia: el comando está en servidor.env.

map $http_upgrade $aeropuerto_conexion {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name aeropuerto.tujuegoya.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aeropuerto.tujuegoya.com;

    ssl_certificate     /etc/ssl/cloudflare/tujuegoya.pem;
    ssl_certificate_key /etc/ssl/cloudflare/tujuegoya.key;

    # La IP de quien entra: la que manda Cloudflare, y solo si el pedido viene de Cloudflare
    # (https://www.cloudflare.com/ips). La web la usa en sus límites por IP y en la bitácora.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Cada ruta de la web pone su propio tope (videos hasta 1 GB); Cloudflare corta cada pedido en 100 MB.
    client_max_body_size 1024m;
    proxy_request_buffering off;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aeropuerto_conexion;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # En vivo, Teléfonos y la cámara de los teléfonos usan WebSockets que pasan rato sin mensajes del cliente.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
