name: aeropuerto-demo
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: aeropuerto
      POSTGRES_USER: aeropuerto
      POSTGRES_PASSWORD: ${DB_PASSWORD:-demo_local_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U aeropuerto -d aeropuerto"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://aeropuerto:${DB_PASSWORD:-demo_local_only}@db:5432/aeropuerto?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1:8080/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
  web:
    build: ./web
    ports:
      # Local: 127.0.0.1. Servidor: BIND_ADDR=0.0.0.0 y WEB_PORT=80 en .env.
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata:
