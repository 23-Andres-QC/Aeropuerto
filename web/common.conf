# Compartido por los server{} de HTTP y HTTPS en default.conf.
server_tokens off;
client_max_body_size 256k;

# Servido por IP pública: comprimir pesa más que cualquier otra cosa aquí.
# Las respuestas JSON de la API (sesiones, insights) comprimen muy bien.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json
           image/svg+xml application/xml;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security $hsts always;
root /usr/share/nginx/html;
index index.html;
location / { try_files $uri $uri/ /index.html; }
# El HTML vive en una URL fija: revalidar siempre para que un despliegue
# nuevo llegue al navegador. Los assets llevan hash y son eternos.
location = /index.html {
 add_header Cache-Control "no-cache" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header X-Frame-Options "SAMEORIGIN" always;
 add_header Referrer-Policy "same-origin" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
 add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
 add_header Strict-Transport-Security $hsts always;
}
location /assets/ {
 add_header Cache-Control "public, max-age=31536000, immutable" always;
 add_header X-Content-Type-Options "nosniff" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
 add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
 add_header Strict-Transport-Security $hsts always;
}
# DNS embebido de Docker: con la dirección en una variable, nginx la
# reresuelve y sobrevive a que el backend se recree con otra IP.
resolver 127.0.0.11 valid=10s ipv6=off;
# Login: pocos intentos por minuto y por IP; el cuerpo es un usuario y una contraseña.
location = /api/v1/auth/login {
 limit_req zone=login burst=5 nodelay;
 limit_req_status 429;
 client_max_body_size 4k;
 set $upstream http://backend:8080;
 proxy_pass $upstream;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_connect_timeout 5s;
 proxy_read_timeout 10s;
}
# nginx le pregunta al backend si la cookie de sesión (o la llave) sirve antes de dejar pasar a lo que sirve
# aparte de /api/: backend-vivo (/vivo/), la sala de cámaras y el panel de personas. 204 pasa, 401 se corta y 403 es
# un rol sin ese módulo: En vivo (/_autenticar), Teléfonos (/_autenticar_telefonos) o Videos (/_autenticar_videos).
location = /_autenticar {
 internal;
 set $upstream http://backend:8080;
 proxy_pass $upstream/api/v1/auth/check?modulo=en_vivo;
 proxy_pass_request_body off;
 proxy_set_header Content-Length "";
 proxy_set_header Host $http_host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_connect_timeout 5s;
 proxy_read_timeout 5s;
}
location = /_autenticar_telefonos {
 internal;
 set $upstream http://backend:8080;
 proxy_pass $upstream/api/v1/auth/check?modulo=telefonos;
 proxy_pass_request_body off;
 proxy_set_header Content-Length "";
 proxy_set_header Host $http_host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_connect_timeout 5s;
 proxy_read_timeout 5s;
}
location = /_autenticar_videos {
 internal;
 set $upstream http://backend:8080;
 proxy_pass $upstream/api/v1/auth/check?modulo=videos;
 proxy_pass_request_body off;
 proxy_set_header Content-Length "";
 # El cuerpo no se reenvía, pero nginx compara su tamaño con el límite de este bloque (1 MB por defecto): sin esto,
 # subir un video de más de 1 MB a Videos (que pasa por aquí) fallaba con 413, que nginx convertía en un 500.
 client_max_body_size 0;
 proxy_set_header Host $http_host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_connect_timeout 5s;
 proxy_read_timeout 5s;
}
location /api/ {
 limit_req zone=api burst=60 nodelay;
 set $upstream http://backend:8080;
 proxy_pass $upstream;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_connect_timeout 5s;
 proxy_read_timeout 30s;
}
# Publicación de una sesión del modelo (Build) y de sus análisis (Parte III)
# en cualquier sitio: miles de puntos en un solo JSON, así que necesita más
# que el límite general.
location ~ ^/api/v1/sites/[^/]+/sessions(/[^/]+/analytics)?$ {
 limit_req zone=api burst=60 nodelay;
 client_max_body_size 64m;
 set $upstream http://backend:8080;
 proxy_pass $upstream;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_connect_timeout 5s;
 proxy_read_timeout 120s;
}
# Carga de tickets de venta (CSV de la caja del local): hasta 5 000 tickets por pedido,
# unos pocos MB de JSON; la demo simulada se genera en el servidor y no sube nada.
location ~ ^/api/v1/sites/[^/]+/ventas/tickets$ {
 limit_req zone=api burst=60 nodelay;
 client_max_body_size 16m;
 set $upstream http://backend:8080;
 proxy_pass $upstream;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_connect_timeout 5s;
 proxy_read_timeout 90s;
}
# La demo simulada genera miles de tickets en el servidor: tarda más que el resto de /api/.
location ~ ^/api/v1/sites/[^/]+/ventas/simulados$ {
 limit_req zone=api burst=60 nodelay;
 set $upstream http://backend:8080;
 proxy_pass $upstream;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_connect_timeout 5s;
 proxy_read_timeout 120s;
}
# Puente de cámara entre dispositivos (ej. celular -> laptop): conexión
# WebSocket de larga duración, así que necesita sus propias cabeceras de
# upgrade y un timeout de lectura mucho mayor que el resto de /api/.
location ~ ^/api/v1/cameras/[^/]+/(publish|watch|detections/publish|detections/watch)$ {
 limit_req zone=api burst=60 nodelay;
 set $upstream http://backend:8080;
 proxy_pass $upstream;
 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection $connection_upgrade;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_connect_timeout 5s;
 proxy_read_timeout 3600s;
}
# Sección Videos: el archivo se sube tal cual a backend-vivo (hasta 1 GB, el
# VIDEO_MAX_MB por defecto) y pasa directo, sin que nginx lo copie a disco.
location = /vivo/api/v1/videos {
 auth_request /_autenticar_videos;
 limit_req zone=api burst=60 nodelay;
 client_max_body_size 1024m;
 proxy_request_buffering off;
 set $vivo http://backend-vivo:8080;
 rewrite ^/vivo(/.*)$ $1 break;
 proxy_pass $vivo;
 proxy_http_version 1.1;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_connect_timeout 5s;
 proxy_send_timeout 600s;
 proxy_read_timeout 600s;
}
# El resumen solo lo entrega el modelo, directo por el 8093. El archivo sí pasa (por
# /vivo/): la web lo reproduce mientras el modelo lo procesa si no lo tiene a mano.
location ~ ^/vivo/api/v1/videos/[^/]+/resumen$ { return 404; }
# Backend de las cámaras en vivo (backend-vivo), separado del de los sitios:
# lista de teléfonos, relevo de video y detecciones, y memoria de identidades.
# Teléfonos le habla por /vivo/ (incluidos los WebSocket del relevo).
location /vivo/ {
 auth_request /_autenticar;
 limit_req zone=api burst=60 nodelay;
 set $vivo http://backend-vivo:8080;
 rewrite ^/vivo(/.*)$ $1 break;
 proxy_pass $vivo;
 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection $connection_upgrade;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_connect_timeout 5s;
 proxy_read_timeout 3600s;
}
# Sala del servicio de cámara web (app-web): Teléfonos muestra ahí todas las
# pantallas conectadas. Si el servicio no está levantado responde 502 y la
# página vuelve a su vista de un panel por cámara.
location = /camara-web/ws/sala {
 auth_request /_autenticar_telefonos;
 limit_req zone=api burst=60 nodelay;
 set $camara_web http://camara-web:8080;
 proxy_pass $camara_web/ws/sala$is_args$args;
 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection $connection_upgrade;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_connect_timeout 5s;
 proxy_read_timeout 3600s;
}
# Códigos de unión y teléfonos de la cámara web: solo el administrador (el chequeo de arriba deja pasar a admin_lap y a
# la llave de los scripts, y corta con 403 a una tienda). El código y los cambios nunca van por la URL de la página pública.
location /camara-web/api/ {
 auth_request /_autenticar_telefonos;
 limit_req zone=api burst=60 nodelay;
 client_max_body_size 4k;
 set $camara_web http://camara-web:8080;
 rewrite ^/camara-web(/.*)$ $1 break;
 proxy_pass $camara_web;
 proxy_set_header Host $http_host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_connect_timeout 5s;
 proxy_read_timeout 10s;
}
# Cámara web (app-web) por la misma IP y puerto que la web: en el servidor solo
# 80/443 pasan el firewall. Es la única parte pública sin login (los teléfonos no inician sesión) y por eso es
# mínima: la página, sus cinco archivos (con el Worker que comprime los cuadros) y el WebSocket con el que se une, solo con GET y con su propio límite de
# peticiones y de conexiones por IP. El panel de personas pide sesión; el MJPEG, la foto y el estado del puerto
# interno no salen de la máquina.
# Redirección relativa: con la absoluta nginx pondría el puerto del contenedor
# (80/443), no el publicado (8080/8443 en local).
location = /camara { absolute_redirect off; return 301 /camara/; }
location ~ ^/camara/(index\.html|app\.js|codificador\.js|estilo\.css|icono\.svg|ws)?$ {
 limit_except GET { deny all; }
 limit_req zone=camara burst=40 nodelay;
 limit_conn camara_conn 30;
 set $camara_web http://camara-web:8080;
 rewrite ^/camara(/.*)$ $1 break;
 proxy_pass $camara_web;
 proxy_http_version 1.1;
 proxy_set_header Upgrade $http_upgrade;
 proxy_set_header Connection $connection_upgrade;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_connect_timeout 5s;
 proxy_read_timeout 3600s;
 # Los JPEG de la cámara (hasta 1 MB cada uno, ver maxFrame en app-web).
 client_max_body_size 2m;
}
# El panel «Ver personas en memoria» de esa página: la memoria de identidades, solo con la sesión de la web.
location = /camara/personas {
 auth_request /_autenticar;
 limit_req zone=api burst=60 nodelay;
 set $camara_web http://camara-web:8080;
 rewrite ^/camara(/.*)$ $1 break;
 proxy_pass $camara_web;
 proxy_set_header Host $http_host;
 proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 proxy_set_header X-Forwarded-Proto $scheme;
 proxy_connect_timeout 5s;
 proxy_read_timeout 10s;
}
location /camara/ { return 404; }
location /health/ {
 set $upstream http://backend:8080;
 proxy_pass $upstream;
 proxy_set_header Host $http_host;
}
