# Publicado por IP: acotar el abuso trivial sin estorbar al sondeo del front.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
server {
 listen 80;
 server_name _;
 server_tokens off;
 client_max_body_size 256k;

 # Servido por IP pública: comprimir pesa más que cualquier otra cosa aquí.
 # El plano SVG son 354 KB sin comprimir.
 gzip on;
 gzip_vary on;
 gzip_comp_level 6;
 gzip_min_length 1024;
 gzip_proxied any;
 gzip_types text/plain text/css application/javascript application/json
            image/svg+xml application/xml;
 add_header X-Content-Type-Options "nosniff" always;
 add_header X-Frame-Options "SAMEORIGIN" always;
 add_header Referrer-Policy "same-origin" always;
 root /usr/share/nginx/html;
 index index.html;
 location / { try_files $uri $uri/ /index.html; }
 # El HTML y el plano viven en URLs fijas: revalidar siempre para que un
 # despliegue nuevo llegue al navegador. Los assets llevan hash y son eternos.
 location = /index.html {
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "same-origin" always;
 }
 location /maps/ {
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
 }
 location /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header X-Content-Type-Options "nosniff" always;
 }
 # DNS embebido de Docker: con la dirección en una variable, nginx la
 # reresuelve y sobrevive a que el backend se recree con otra IP.
 resolver 127.0.0.11 valid=10s ipv6=off;
 location /api/ {
  limit_req zone=api burst=60 nodelay;
  set $upstream http://backend:8080;
  proxy_pass $upstream;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout 30s;
 }
 location /health/ {
  set $upstream http://backend:8080;
  proxy_pass $upstream;
  proxy_set_header Host $http_host;
 }
}
