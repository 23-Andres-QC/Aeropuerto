# Publicado por IP: acotar el abuso trivial sin estorbar al sondeo del front.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
server {
 listen 80;
 server_name _;
 server_tokens off;
 add_header X-Content-Type-Options "nosniff" always;
 add_header X-Frame-Options "SAMEORIGIN" always;
 add_header Referrer-Policy "same-origin" always;
 root /usr/share/nginx/html;
 index index.html;
 location / { try_files $uri $uri/ /index.html; }
 # El HTML y el plano viven en URLs fijas: revalidar siempre para que un
 # despliegue nuevo llegue al navegador. Los assets llevan hash y son eternos.
 location = /index.html {
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "same-origin" always;
 }
 location /maps/ {
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
 }
 location /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header X-Content-Type-Options "nosniff" always;
 }
 # DNS embebido de Docker: con la dirección en una variable, nginx la
 # reresuelve y sobrevive a que el backend se recree con otra IP.
 resolver 127.0.0.11 valid=10s ipv6=off;
 location /api/ {
  limit_req zone=api burst=60 nodelay;
  set $upstream http://backend:8080;
  proxy_pass $upstream;
  proxy_set_header Host $http_host;
 }
 location /health/ {
  set $upstream http://backend:8080;
  proxy_pass $upstream;
  proxy_set_header Host $http_host;
 }
 location /ws/ {
  set $upstream http://backend:8080;
  proxy_pass $upstream;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $http_host;
  proxy_read_timeout 60s;
 }
}
