# Publicado por IP: acotar el abuso trivial sin estorbar al sondeo del front.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
# Intentos de login: pocos por minuto y por IP (el backend además bloquea a quien falla 5 veces seguidas).
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
# La puerta pública de las cámaras de teléfono (/camara/) tiene su propio límite, aparte del de la API:
# páginas por segundo y conexiones abiertas por IP.
limit_req_zone $binary_remote_addr zone=camara:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=camara_conn:10m;

# HSTS solo cuando la página se sirve por HTTPS (con el valor vacío nginx no envía la cabecera).
map $scheme $hsts {
 default "";
 https "max-age=31536000; includeSubDomains";
}

# Puente de cámara (publish/watch): solo upgradea la conexión a WebSocket
# cuando el cliente lo pide; una petición HTTP normal no lleva Upgrade.
map $http_upgrade $connection_upgrade {
 default upgrade;
 ''      close;
}

server {
 listen 80;
 server_name _;
 include /etc/nginx/snippets/common.conf;
}

# HTTPS con certificado autofirmado (generado al arrancar el contenedor por
# docker-entrypoint.sh, nunca se guarda una clave privada en el repo). Sirve
# para usar la cámara desde otro dispositivo en la misma red: los navegadores
# solo dan permiso de getUserMedia en "contexto seguro" (HTTPS o localhost) -
# un celular abriendo la IP LAN por HTTP plano no califica. El navegador va a
# advertir que el certificado no es de confianza (es autofirmado a propósito,
# solo para esta demo local); "Avanzado > Continuar" es lo esperado.
server {
 listen 443 ssl;
 server_name _;
 ssl_certificate /etc/nginx/certs/selfsigned.crt;
 ssl_certificate_key /etc/nginx/certs/selfsigned.key;
 ssl_protocols TLSv1.2 TLSv1.3;
 include /etc/nginx/snippets/common.conf;
}
